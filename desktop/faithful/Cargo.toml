[package]
name = "onenil-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
onenil-engine = { path = "../../engine" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[features]
default = []
software = ["dep:minifb", "dep:fontdue"]

[dependencies.minifb]
version = "=0.29.0"
optional = true
default-features = false
features = ["x11"]

[dependencies.fontdue]
version = "=0.9.5"
optional = true
