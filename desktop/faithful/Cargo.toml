[package]
name = "onenil-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
onenil-engine = { path = "../../engine" }
onenil-campaign = { path = "../../campaign" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[features]
default = []
raster = ["dep:fontdue"]
software = ["dep:minifb", "raster"]
egui = ["dep:eframe", "raster"]

[dependencies.minifb]
version = "=0.29.0"
optional = true
default-features = false
features = ["x11"]

[dependencies.fontdue]
version = "=0.9.5"
optional = true

[dependencies.eframe]
version = "=0.37.0"
optional = true
default-features = false
features = ["glow", "x11"]
