[package]
name = "onenil-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "onenil_engine"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
pyo3 = { version = "=0.30.1", optional = true, features = ["extension-module", "abi3-py312"] }

[dev-dependencies]
sha2 = "=0.10.9"
