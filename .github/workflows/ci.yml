name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fetch accepted interval listing
        uses: actions/checkout@v4
        with:
          repository: diegoami/onenil-archaeology
          ref: 5d91e39543e5747cf9f84356512ac1b56228505b
          path: .cache/interval-source
          persist-credentials: false
      - run: python3 tools/generate_interval.py --research-root .cache/interval-source --check
      - name: Fetch accepted post-match evidence
        uses: actions/checkout@v4
        with:
          repository: diegoami/onenil-archaeology
          ref: ef8dad0ea8a7a20cdfa86ea048cf319a02b3a163
          fetch-depth: 0
          path: .cache/post-match-source
          persist-credentials: false
      - name: Check post-match graph and explicit condition boundary
        run: python3 tools/test_post_match_graph.py --research-root .cache/post-match-source
      - name: Authenticate original pre-match admission
        run: |
          python3 -m pip install -r .cache/post-match-source/requirements.txt
          python3 tools/post_match_incoming.py --research-root .cache/post-match-source --check
          python3 tools/test_post_match_incoming.py
      - name: Fetch the witnessed Sevilla capture
        uses: actions/checkout@v4
        with:
          repository: diegoami/onenil-archaeology
          ref: 3d41a0dbf6b0a5ccd5cb7fe2d0076f5bce1ab58e
          path: .cache/sevilla-source
          persist-credentials: false
      - name: Fetch the witnessed Sevilla week
        uses: actions/checkout@v4
        with:
          repository: diegoami/onenil-archaeology
          ref: 788b8332db4a9aab8304f5d9abef80c091dde3ee
          path: .cache/sevilla-week-source
          persist-credentials: false
      - name: Authenticate the witnessed Sevilla week receipt
        run: |
          python3 tools/sevilla_week_inputs.py --research-root .cache/sevilla-week-source --check
          python3 tools/test_sevilla_week_inputs.py
      - name: Fetch the captured league display
        uses: actions/checkout@v4
        with:
          repository: diegoami/onenil-archaeology
          ref: 16029c0db43156c138cc115af0291c0251e479a9
          fetch-depth: 0
          path: .cache/league-display-source
          persist-credentials: false
      - name: Check the captured unplayed divisions and empty notice
        run: python3 campaign/import_league_display.py --research-root .cache/league-display-source --check
      - run: cargo test --manifest-path campaign/Cargo.toml --locked
      - name: Check the witnessed Sevilla reference assets
        run: |
          python3 tools/sevilla_reference_inputs.py --research-root .cache/sevilla-source --check
          python3 tools/test_sevilla_reference_inputs.py
      - run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - run: cargo test --manifest-path engine/Cargo.toml --locked
      - name: Warnings are errors in every crate
        run: |
          RUSTFLAGS=-Dwarnings cargo check --manifest-path engine/Cargo.toml --locked --all-targets
          RUSTFLAGS=-Dwarnings cargo check --manifest-path campaign/Cargo.toml --locked --all-targets
          RUSTFLAGS=-Dwarnings cargo check --manifest-path desktop/faithful/Cargo.toml --locked --all-targets
      - name: Replay the owned interval against both original streams
        run: |
          cargo build --manifest-path engine/Cargo.toml --release --locked --example interval_probe
          python3 tools/check_interval.py --probe engine/target/release/examples/interval_probe
      - name: Verify the original halftime replacement transaction
        run: |
          cargo build --manifest-path engine/Cargo.toml --release --locked --example replacement_probe
          python3 tools/check_interval_replacement.py --research-root .cache/interval-source --probe engine/target/release/examples/replacement_probe
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install maturin==1.16.0
          . .venv/bin/activate
          maturin develop --manifest-path engine/Cargo.toml --features python --release --locked
          python3 tools/replay_contests.py --check
          python3 tools/replay_placement.py --check
          python3 tools/replay_goal_effects.py --check
          python3 tools/replay_ratings.py --check
          python3 tools/replay_step_tail.py --check
          python3 tools/replay_quick_match.py --check
          python3 tools/replay_fresh_preparation.py --replay
          python3 tools/test_edited_preparation.py
          python3 tools/replay_edited_preparation.py --replay
          python3 tools/fresh_watched_inputs.py --check
          python3 tools/test_fresh_watched_inputs.py
          python3 tools/test_fresh_watched_reference.py
          python3 tools/replay_fresh_watched.py --replay --python
          python3 tools/test_edited_watched_inputs.py
          python3 tools/test_edited_lookup_inputs.py
          python3 tools/test_edited_watched_reference.py
          python3 tools/replay_edited_watched.py --replay
      - run: python3 tools/check_originals.py
      - run: python3 desktop/faithful/test_capture_lock.py
      - run: python3 desktop/faithful/export_match_names.py --check
      - run: python3 desktop/faithful/check_match_records.py records/T62/window-r0003.json
      - run: python3 desktop/faithful/check_quick_week_records.py records/T119/window-r0006.json
      - run: python3 desktop/faithful/check_edited_result_records.py records/T69/window-r0001.json
      - run: cargo test --manifest-path desktop/faithful/Cargo.toml --release --locked
      - name: Verify live halftime child ownership
        run: |
          cargo build --manifest-path desktop/faithful/Cargo.toml --release --locked --example live_worker_probe --bin onenil-desktop
          python3 tools/check_live_worker.py --probe desktop/faithful/target/release/examples/live_worker_probe --worker desktop/faithful/target/release/onenil-desktop
      - run: python3 desktop/faithful/check_readability_records.py records/T70/window-r0001.json
      - name: Raster readability regressions
        run: |
          python3 - <<'PYFONT'
          import runpy
          from pathlib import Path
          runpy.run_path('docs/desktop-fidelity/mockups/build.py')['font_bytes'](
              Path('.cache/T51-font/PxPlus_IBM_VGA_8x16.ttf'), fetch=True)
          PYFONT
          ONENIL_DESKTOP_FONT="$PWD/.cache/T51-font/PxPlus_IBM_VGA_8x16.ttf" cargo test --manifest-path desktop/faithful/Cargo.toml --release --locked --features raster --lib --test history --test sevilla_week_route
      - run: python3 desktop/faithful/check_numbered_pitch_records.py records/T72/window-r0001.json
      - run: python3 desktop/faithful/check_numbered_pitch_records.py records/T72/window-r0002.json
      - run: python3 desktop/faithful/check_history_records.py records/T73/window-r0001.json
      - name: Verify live desktop interval and saved continuation evidence
        run: |
          python3 desktop/faithful/check_live_desktop_records.py records/T77/window-r0003.json
          python3 desktop/faithful/check_live_desktop_records.py records/T77/window-r0004.json
