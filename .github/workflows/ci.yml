name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - run: cargo test --manifest-path engine/Cargo.toml --locked
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install maturin==1.16.0
          . .venv/bin/activate
          maturin develop --manifest-path engine/Cargo.toml --features python --release --locked
          python3 tools/replay_contests.py --check
          python3 tools/replay_placement.py --check
          python3 tools/replay_goal_effects.py --check
          python3 tools/replay_ratings.py --check
          python3 tools/replay_step_tail.py --check
          python3 tools/replay_fresh_preparation.py --replay
          python3 tools/test_edited_preparation.py
          python3 tools/replay_edited_preparation.py --replay
          python3 tools/fresh_watched_inputs.py --check
          python3 tools/test_fresh_watched_inputs.py
          python3 tools/test_fresh_watched_reference.py
          python3 tools/replay_fresh_watched.py --replay --python
          python3 tools/test_edited_watched_inputs.py
          python3 tools/test_edited_lookup_inputs.py
          python3 tools/test_edited_watched_reference.py
          python3 tools/replay_edited_watched.py --replay
      - run: python3 tools/check_originals.py
      - run: python3 desktop/faithful/export_match_names.py --check
      - run: python3 desktop/faithful/check_match_records.py records/T62/window-r0003.json
      - run: python3 desktop/faithful/check_edited_result_records.py records/T69/window-r0001.json
      - run: cargo test --manifest-path desktop/faithful/Cargo.toml --release --locked
      - run: python3 desktop/faithful/check_readability_records.py records/T70/window-r0001.json
      - name: Raster readability regressions
        run: |
          python3 - <<'PYFONT'
          import runpy
          from pathlib import Path
          runpy.run_path('docs/desktop-fidelity/mockups/build.py')['font_bytes'](
              Path('.cache/T51-font/PxPlus_IBM_VGA_8x16.ttf'), fetch=True)
          PYFONT
          ONENIL_DESKTOP_FONT="$PWD/.cache/T51-font/PxPlus_IBM_VGA_8x16.ttf" cargo test --manifest-path desktop/faithful/Cargo.toml --release --locked --features raster --lib --test history
      - run: python3 desktop/faithful/check_numbered_pitch_records.py records/T72/window-r0001.json
      - run: python3 desktop/faithful/check_numbered_pitch_records.py records/T72/window-r0002.json
      - run: python3 desktop/faithful/check_history_records.py records/T73/window-r0001.json
